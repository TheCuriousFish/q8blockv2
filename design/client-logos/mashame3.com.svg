<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#4169B5"/>
  <!-- Snowflake icon for AC company -->
  <!-- Center dot -->
  <circle cx="16" cy="16" r="2" fill="white"/>
  <!-- 6 arms -->
  <line x1="16" y1="5" x2="16" y2="27" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="5.8" y1="10.5" x2="26.2" y2="21.5" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="5.8" y1="21.5" x2="26.2" y2="10.5" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <!-- Top arm ticks -->
  <line x1="16" y1="8" x2="13" y2="11" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="8" x2="19" y2="11" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Bottom arm ticks -->
  <line x1="16" y1="24" x2="13" y2="21" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="24" x2="19" y2="21" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Top-right arm ticks -->
  <line x1="23.6" y1="12" x2="20.1" y2="13.7" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="23.6" y1="12" x2="22" y2="15.5" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Bottom-left arm ticks -->
  <line x1="8.4" y1="20" x2="11.9" y2="18.3" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="8.4" y1="20" x2="10" y2="16.5" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Top-left arm ticks -->
  <line x1="8.4" y1="12" x2="11.9" y2="13.7" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="8.4" y1="12" x2="10" y2="15.5" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Bottom-right arm ticks -->
  <line x1="23.6" y1="20" x2="20.1" y2="18.3" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="23.6" y1="20" x2="22" y2="16.5" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
</svg>
